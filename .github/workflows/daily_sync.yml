name: Daily Drive Backup to MegaUp

on:
  schedule:
    # နေ့စဉ် ည ၁၂:၀၀ နာရီတိုင်း အလိုအလျောက် စစ်ဆေးရန် (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # လိုအပ်ပါက Actions tab မှ ကိုယ်တိုင် ခလုတ်နှိပ်ပြီး run ရန်

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rclone & Dependencies
        run: |
          curl https://rclone.org/install.sh | sudo bash
          pip install -r requirements.txt

      - name: Configure Rclone
        env:
          CONFIG_B64: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.config/rclone
          python -c "import os, base64; open(os.path.expanduser('~/.config/rclone/rclone.conf'), 'wb').write(base64.b64decode(os.environ['CONFIG_B64']))"
          echo "=== Registered Rclone Remotes ==="
          rclone listremotes

      - name: Run Transfer & Cleanup
        env:
          MEGAUP_KEY1: ${{ secrets.MEGAUP_KEY1 }}
          MEGAUP_KEY2: ${{ secrets.MEGAUP_KEY2 }}
          MEGAUP_FOLDER_ID: "63172"
          RCLONE_REMOTE: "ShareDrive"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u transfer.py
